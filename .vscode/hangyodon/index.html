<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hangyodon</title>
    <style>
        html, body { height: 100%; margin: 0; overflow: hidden; background: #dddddd; font-family: system-ui, sans-serif; }
        #mycanvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
        #mycanvas.dragging { cursor: grabbing; }
        #ui { position: fixed; left: 0; right: 0; bottom: 14px; display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; }
        #ui .hint { font-size: 13px; color: #555; }
        #ui .btns { display: flex; gap: 8px; pointer-events: auto; }
        #ui button { border: 0; border-radius: 8px; padding: 7px 14px; font-size: 13px; background: #fff; color: #333; box-shadow: 0 1px 3px rgba(0,0,0,.2); cursor: pointer; }
        #ui button:hover { background: #f2f2f2; }
        #ui button.idle { background: #4b8ecb; color: #fff; margin-left: 10px; }
        #ui button.idle:hover { background: #3f7fb8; }
        #ui button.idle.active { background: #e0706a; }
        #ui button.idle.active:hover { background: #cf615b; }
    </style>
    <script type="module" src="main_hangyodon.js"></script>
</head>
<body>
    <canvas id="mycanvas"></canvas>
    <div id="ui">
        <div class="btns">
            <button id="idleBtn" class="idle">▶ Idle</button>
        </div>
    </div>
</body>
</html>
